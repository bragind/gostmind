[project]
name = "gostmind"
version = "0.1.0"
dependencies = [
  "fastapi>=0.110.0",
  "pydantic>=2.5",
  "pydantic-settings>=2.0.0",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg",
  "alembic",
  "redis[asyncio]",
  "chromadb>=0.4.20",
  "httpx>=0.25.0",
  "python-multipart",  # для загрузки файлов
  "structlog",
  "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-asyncio",
  "httpx",
  "respx",
  "ruff>=0.1.0",
  "mypy",
  "pre-commit",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"